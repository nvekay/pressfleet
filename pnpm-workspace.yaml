packages:
  - apps/*
  - packages/*
  - wp/plugins/*

allowBuilds:
  # esbuild (used by tsx, vite and drizzle-kit) checks its platform binary on install
  esbuild: true
  # Optional native file locking used by @wordpress/env; it falls back without it
  fs-ext-extra-prebuilt: false
  # Optional native accelerator for BullMQ's msgpack; works without it
  msgpackr-extract: false
